name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Eyni branch üzrə köhnə run-lar ləğv olunur. `main` istisnadır: yarımçıq kəsilən
  # production deploy R2 keşini natamam qoya bilər, ona görə orada yeni run növbəyə durur.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: heç bir job repo-ya yazmır, yalnız kodu oxuyur.
permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # package-lock.json-un formatı npm major versiyasından asılıdır: npm 12 opsional
      # peer qeydlərini (məs. @swc/helpers) lock-dan çıxarır, npm 10/11 isə onları tələb edir.
      # Ona görə CI package.json-dakı `packageManager` dəyəri ilə eyni npm-i quraşdırır.
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@').pop()")"
          echo "packageManager: npm@${NPM_VERSION}"
          npm install -g "npm@${NPM_VERSION}"
          npm --version
          npm ci

      - name: Run unit tests
        run: npm run test

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  production-validation:
    name: Production validation
    needs: quality
    # Yalnız `main`-ə push zamanı: PR və manual dispatch production resurslarına toxunmur.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@').pop()")"
          echo "packageManager: npm@${NPM_VERSION}"
          npm install -g "npm@${NPM_VERSION}"
          npm --version
          npm ci

      # Secret-ə düşən artıq boşluq/sətir sonu wrangler-i "Invalid account ID" ilə saxlayır,
      # ona görə dəyərlər təmizlənir, formatı yoxlanılır və sonrakı step-lərə maskalanmış
      # şəkildə ötürülür. Job səviyyəsində env yazılmır ki, GITHUB_ENV ilə ziddiyyət olmasın.
      - name: Verify Cloudflare credentials
        shell: bash
        env:
          RAW_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${RAW_API_TOKEN:?CLOUDFLARE_API_TOKEN secret is not configured}"
          : "${RAW_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID secret is not configured}"
          API_TOKEN="$(printf '%s' "${RAW_API_TOKEN}" | tr -d '[:space:]')"
          ACCOUNT_ID="$(printf '%s' "${RAW_ACCOUNT_ID}" | tr -d '[:space:]')"
          # Dəyər maskalandığı üçün log-da görünmür; diaqnostika kimi yalnız uzunluq və
          # qaydaya uymayan simvolların sayı yazılır (terminal paste işarələri, dırnaq, `=`).
          check_format() {
            local label="$1" value="$2" expected="$3"
            if [[ "${value}" =~ ^[A-Za-z0-9_-]+$ ]]; then
              return 0
            fi
            local bad
            bad="$(printf '%s' "${value}" | tr -d 'A-Za-z0-9_-' | wc -c | tr -d ' ')"
            echo "::error::${label} secret is malformed: length=${#value}, ${bad} unexpected character(s); expected ${expected}. Store the bare value only — no NAME= prefix, quotes or terminal paste markers."
            return 1
          }
          check_format "CLOUDFLARE_ACCOUNT_ID" "${ACCOUNT_ID}" "32 hexadecimal characters"
          check_format "CLOUDFLARE_API_TOKEN" "${API_TOKEN}" "40 letters, digits, underscores or hyphens"
          echo "::add-mask::${API_TOKEN}"
          echo "::add-mask::${ACCOUNT_ID}"
          {
            echo "CLOUDFLARE_API_TOKEN=${API_TOKEN}"
            echo "CLOUDFLARE_ACCOUNT_ID=${ACCOUNT_ID}"
          } >> "${GITHUB_ENV}"
          echo "Cloudflare credentials are present."

      # Miqrasiyanın repoda olması onun tətbiq edildiyi demək deyil — kod cədvəl gözləyib
      # bazada tapmayanda xəta çox vaxt səssizcə udulur. Deploy-dan əvvəl vəziyyət yoxlanılır.
      - name: Check production D1 migration status
        run: npx wrangler d1 migrations list DB --remote

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [quality, production-validation]
    # `needs` skip olunanda bu job da skip olunur; şərt yenə açıq yazılır ki, deploy
    # yalnız `main`-ə push zamanı işləsin və PR heç vaxt production-a çıxmasın.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@').pop()")"
          echo "packageManager: npm@${NPM_VERSION}"
          npm install -g "npm@${NPM_VERSION}"
          npm --version
          npm ci

      # Eyni normallaşdırma deploy-da da lazımdır: GITHUB_ENV job-lar arasında ötürülmür.
      - name: Verify Cloudflare credentials
        shell: bash
        env:
          RAW_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${RAW_API_TOKEN:?CLOUDFLARE_API_TOKEN secret is not configured}"
          : "${RAW_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID secret is not configured}"
          API_TOKEN="$(printf '%s' "${RAW_API_TOKEN}" | tr -d '[:space:]')"
          ACCOUNT_ID="$(printf '%s' "${RAW_ACCOUNT_ID}" | tr -d '[:space:]')"
          # Dəyər maskalandığı üçün log-da görünmür; diaqnostika kimi yalnız uzunluq və
          # qaydaya uymayan simvolların sayı yazılır (terminal paste işarələri, dırnaq, `=`).
          check_format() {
            local label="$1" value="$2" expected="$3"
            if [[ "${value}" =~ ^[A-Za-z0-9_-]+$ ]]; then
              return 0
            fi
            local bad
            bad="$(printf '%s' "${value}" | tr -d 'A-Za-z0-9_-' | wc -c | tr -d ' ')"
            echo "::error::${label} secret is malformed: length=${#value}, ${bad} unexpected character(s); expected ${expected}. Store the bare value only — no NAME= prefix, quotes or terminal paste markers."
            return 1
          }
          check_format "CLOUDFLARE_ACCOUNT_ID" "${ACCOUNT_ID}" "32 hexadecimal characters"
          check_format "CLOUDFLARE_API_TOKEN" "${API_TOKEN}" "40 letters, digits, underscores or hyphens"
          echo "::add-mask::${API_TOKEN}"
          echo "::add-mask::${ACCOUNT_ID}"
          {
            echo "CLOUDFLARE_API_TOKEN=${API_TOKEN}"
            echo "CLOUDFLARE_ACCOUNT_ID=${ACCOUNT_ID}"
          } >> "${GITHUB_ENV}"
          echo "Cloudflare credentials are present."

      # `wrangler.jsonc` → `main: .open-next/worker.js`. Bundle olmadan deploy mümkün deyil,
      # ona görə package.json-dakı `deploy` skriptinin build mərhələsi eyni dəyişənlərlə
      # təkrarlanır (statik səhifələr bu dəyərləri build vaxtı içinə alır).
      - name: Build OpenNext worker bundle
        env:
          SITE_URL: https://luxehomeestate.az
          IS_STAGING: "false"
          NEXT_PUBLIC_GTM_ID: GTM-MMV4VC9L
        run: npx opennextjs-cloudflare build

      # Bu repoda `wrangler deploy` OpenNext layihəsini tanıyır və `opennextjs-cloudflare
      # deploy`-a ötürür (ISR keşinin R2-yə yüklənməsi + worker yayımı).
      # `--env=""` production konfiqurasiyasını açıq seçir ki, səhvən `env.staging` getməsin.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --env=""
