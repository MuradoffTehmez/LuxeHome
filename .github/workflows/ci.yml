name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Eyni branch üzrə köhnə run-lar ləğv olunur. `main` istisnadır: yarımçıq kəsilən
  # deploy R2 keşini natamam qoya bilər, ona görə orada yeni run növbəyə durur.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: heç bir job repo-ya yazmır, yalnız kodu oxuyur.
permissions:
  contents: read

# Yayım axını (yalnız `main`-ə push):
#
#   quality → deploy-staging → e2e-staging → deploy-production
#
# Hər deploy job-u əvvəlcə **öz mühitinin D1 miqrasiyalarını tətbiq edir**, sonra
# bundle qurur və worker-i yayımlayır. Bu sıra məcburidir: yeni kod çox vaxt yeni
# sütun gözləyir, əvvəlcə worker yayımlansa sxem gəlincəyə qədər sorğular çökür və
# xəta `try/catch` içində səssizcə udulur.
#
# Staging production-dan əvvəl gedir — miqrasiya və ya yayım orada sınarsa
# production heç toxunulmur. Browser E2E dəsti canlı staging-ə qarşı işləyir və
# uğursuz olduğu halda production yayımını saxlayır.
jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # package-lock.json-un formatı npm major versiyasından asılıdır: npm 12 opsional
      # peer qeydlərini (məs. @swc/helpers) lock-dan çıxarır, npm 10/11 isə onları tələb edir.
      # Ona görə CI package.json-dakı `packageManager` dəyəri ilə eyni npm-i quraşdırır.
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@').pop()")"
          echo "packageManager: npm@${NPM_VERSION}"
          npm install -g "npm@${NPM_VERSION}"
          npm --version
          npm ci

      - name: Run unit tests
        run: npm run test

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  deploy-staging:
    name: Deploy to staging
    needs: quality
    # Yalnız `main`-ə push zamanı: PR və manual dispatch canlı resurslara toxunmur.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@').pop()")"
          echo "packageManager: npm@${NPM_VERSION}"
          npm install -g "npm@${NPM_VERSION}"
          npm --version
          npm ci

      # Secret-ə düşən artıq boşluq/sətir sonu wrangler-i "Invalid account ID" ilə saxlayır,
      # ona görə dəyərlər təmizlənir, formatı yoxlanılır və sonrakı step-lərə maskalanmış
      # şəkildə ötürülür. Blok hər deploy job-unda təkrarlanır: `GITHUB_ENV` job-lar
      # arasında ötürülmür.
      - name: Verify Cloudflare credentials
        shell: bash
        env:
          RAW_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${RAW_API_TOKEN:?CLOUDFLARE_API_TOKEN secret is not configured}"
          : "${RAW_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID secret is not configured}"
          API_TOKEN="$(printf '%s' "${RAW_API_TOKEN}" | tr -d '[:space:]')"
          ACCOUNT_ID="$(printf '%s' "${RAW_ACCOUNT_ID}" | tr -d '[:space:]')"
          # Dəyər maskalandığı üçün log-da görünmür; diaqnostika kimi yalnız uzunluq və
          # qaydaya uymayan simvolların sayı yazılır (terminal paste işarələri, dırnaq, `=`).
          check_format() {
            local label="$1" value="$2" expected="$3"
            if [[ "${value}" =~ ^[A-Za-z0-9_-]+$ ]]; then
              return 0
            fi
            local bad
            bad="$(printf '%s' "${value}" | tr -d 'A-Za-z0-9_-' | wc -c | tr -d ' ')"
            echo "::error::${label} secret is malformed: length=${#value}, ${bad} unexpected character(s); expected ${expected}. Store the bare value only — no NAME= prefix, quotes or terminal paste markers."
            return 1
          }
          check_format "CLOUDFLARE_ACCOUNT_ID" "${ACCOUNT_ID}" "32 hexadecimal characters"
          check_format "CLOUDFLARE_API_TOKEN" "${API_TOKEN}" "40 letters, digits, underscores or hyphens"
          echo "::add-mask::${API_TOKEN}"
          echo "::add-mask::${ACCOUNT_ID}"
          {
            echo "CLOUDFLARE_API_TOKEN=${API_TOKEN}"
            echo "CLOUDFLARE_ACCOUNT_ID=${ACCOUNT_ID}"
          } >> "${GITHUB_ENV}"
          echo "Cloudflare credentials are present."

      # Miqrasiya bundle-dan əvvəl gəlir. `apply` uğursuz olsa job dayanır və
      # yayım heç başlamır — sxemi köhnə qalan worker yayımlamaqdansa deploy-u
      # dayandırmaq daha az zərərlidir.
      - name: Apply staging D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --env staging

      - name: Log staging D1 migration status
        run: npx wrangler d1 migrations list DB --remote --env staging

      # `SITE_URL` statik səhifələrin içinə build vaxtı yazılır, ona görə staging və
      # production üçün bundle ayrı-ayrı qurulur — bir build-i iki mühitə yaymaq
      # canonical URL-ləri və Open Graph linklərini yanlış edərdi. `IS_STAGING` isə
      # robots/SEO qatını və nümunə məzmun defoltunu idarə edir
      # (`src/lib/demo-content.ts`). Analitika ID-si staging-ə qəsdən verilmir.
      - name: Build OpenNext worker bundle (staging)
        env:
          SITE_URL: https://luxehomeestate-staging.amiyevbahadur.workers.dev
          IS_STAGING: "true"
        run: npx opennextjs-cloudflare build

      - name: Deploy to staging worker
        run: npx wrangler deploy --env staging

  e2e-staging:
    name: Browser E2E (staging)
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@').pop()")"
          echo "packageManager: npm@${NPM_VERSION}"
          npm install -g "npm@${NPM_VERSION}"
          npm --version
          npm ci

      # Yalnız chromium quraşdırılır: mobil layihə də eyni brauzeri Pixel 7
      # viewport-u ilə işlədir, ona görə firefox/webkit yükləməyə ehtiyac yoxdur.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Testlər canlı staging worker-inə qarşı işləyir: nümunə məzmun orada
      # açıqdır (300+ elan), runtime isə production ilə eynidir.
      - name: Run E2E suite
        env:
          E2E_BASE_URL: https://luxehomeestate-staging.amiyevbahadur.workers.dev
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy-production:
    name: Deploy to production
    # Staging əvvəl gedir və E2E orada keçməlidir: miqrasiya, yayım və ya browser
    # axını sınarsa production toxunulmur.
    needs: [quality, deploy-staging, e2e-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@').pop()")"
          echo "packageManager: npm@${NPM_VERSION}"
          npm install -g "npm@${NPM_VERSION}"
          npm --version
          npm ci

      - name: Verify Cloudflare credentials
        shell: bash
        env:
          RAW_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${RAW_API_TOKEN:?CLOUDFLARE_API_TOKEN secret is not configured}"
          : "${RAW_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID secret is not configured}"
          API_TOKEN="$(printf '%s' "${RAW_API_TOKEN}" | tr -d '[:space:]')"
          ACCOUNT_ID="$(printf '%s' "${RAW_ACCOUNT_ID}" | tr -d '[:space:]')"
          check_format() {
            local label="$1" value="$2" expected="$3"
            if [[ "${value}" =~ ^[A-Za-z0-9_-]+$ ]]; then
              return 0
            fi
            local bad
            bad="$(printf '%s' "${value}" | tr -d 'A-Za-z0-9_-' | wc -c | tr -d ' ')"
            echo "::error::${label} secret is malformed: length=${#value}, ${bad} unexpected character(s); expected ${expected}. Store the bare value only — no NAME= prefix, quotes or terminal paste markers."
            return 1
          }
          check_format "CLOUDFLARE_ACCOUNT_ID" "${ACCOUNT_ID}" "32 hexadecimal characters"
          check_format "CLOUDFLARE_API_TOKEN" "${API_TOKEN}" "40 letters, digits, underscores or hyphens"
          echo "::add-mask::${API_TOKEN}"
          echo "::add-mask::${ACCOUNT_ID}"
          {
            echo "CLOUDFLARE_API_TOKEN=${API_TOKEN}"
            echo "CLOUDFLARE_ACCOUNT_ID=${ACCOUNT_ID}"
          } >> "${GITHUB_ENV}"
          echo "Cloudflare credentials are present."

      # Eyni sıra production üçün də qüvvədədir: əvvəlcə sxem, sonra kod.
      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      # Tətbiqdən sonrakı vəziyyət run-un tarixçəsində qalsın deyə loglanır.
      - name: Log production D1 migration status
        run: npx wrangler d1 migrations list DB --remote

      - name: Build OpenNext worker bundle (production)
        env:
          SITE_URL: https://luxehomeestate.az
          IS_STAGING: "false"
          NEXT_PUBLIC_GTM_ID: GTM-MMV4VC9L
        run: npx opennextjs-cloudflare build

      # Bu repoda `wrangler deploy` OpenNext layihəsini tanıyır və `opennextjs-cloudflare
      # deploy`-a ötürür (ISR keşinin R2-yə yüklənməsi + worker yayımı).
      # `--env=""` production konfiqurasiyasını açıq seçir ki, səhvən `env.staging` getməsin.
      - name: Deploy to production worker
        run: npx wrangler deploy --env=""
