name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Eyni branch üzrə köhnə run-lar ləğv olunur. `main` istisnadır: yarımçıq kəsilən
  # production deploy R2 keşini natamam qoya bilər, ona görə orada yeni run növbəyə durur.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: heç bir job repo-ya yazmır, yalnız kodu oxuyur.
permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # package-lock.json-un formatı npm major versiyasından asılıdır: npm 12 opsional
      # peer qeydlərini (məs. @swc/helpers) lock-dan çıxarır, npm 10/11 isə onları tələb edir.
      # Ona görə CI package.json-dakı `packageManager` dəyəri ilə eyni npm-i quraşdırır.
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@').pop()")"
          echo "packageManager: npm@${NPM_VERSION}"
          npm install -g "npm@${NPM_VERSION}"
          npm --version
          npm ci

      - name: Run unit tests
        run: npm run test

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  production-validation:
    name: Production validation
    needs: quality
    # Yalnız `main`-ə push zamanı: PR və manual dispatch production resurslarına toxunmur.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@').pop()")"
          echo "packageManager: npm@${NPM_VERSION}"
          npm install -g "npm@${NPM_VERSION}"
          npm --version
          npm ci

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN secret is not configured}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID secret is not configured}"
          echo "Cloudflare credentials are present."

      # Miqrasiyanın repoda olması onun tətbiq edildiyi demək deyil — kod cədvəl gözləyib
      # bazada tapmayanda xəta çox vaxt səssizcə udulur. Deploy-dan əvvəl vəziyyət yoxlanılır.
      - name: Check production D1 migration status
        run: npx wrangler d1 migrations list DB --remote

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [quality, production-validation]
    # `needs` skip olunanda bu job da skip olunur; şərt yenə açıq yazılır ki, deploy
    # yalnız `main`-ə push zamanı işləsin və PR heç vaxt production-a çıxmasın.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@').pop()")"
          echo "packageManager: npm@${NPM_VERSION}"
          npm install -g "npm@${NPM_VERSION}"
          npm --version
          npm ci

      # `wrangler.jsonc` → `main: .open-next/worker.js`. Bundle olmadan deploy mümkün deyil,
      # ona görə package.json-dakı `deploy` skriptinin build mərhələsi eyni dəyişənlərlə
      # təkrarlanır (statik səhifələr bu dəyərləri build vaxtı içinə alır).
      - name: Build OpenNext worker bundle
        env:
          SITE_URL: https://luxehomeestate.az
          IS_STAGING: "false"
          NEXT_PUBLIC_GTM_ID: GTM-MMV4VC9L
        run: npx opennextjs-cloudflare build

      # Bu repoda `wrangler deploy` OpenNext layihəsini tanıyır və `opennextjs-cloudflare
      # deploy`-a ötürür (ISR keşinin R2-yə yüklənməsi + worker yayımı).
      # `--env=""` production konfiqurasiyasını açıq seçir ki, səhvən `env.staging` getməsin.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --env=""
