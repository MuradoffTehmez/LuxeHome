name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Test, typecheck, lint və build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Repository-ni yüklə
        uses: actions/checkout@v4

      - name: Node.js qur
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # package-lock.json-un formatı npm major versiyasından asılıdır: npm 12 opsional
      # peer qeydlərini (məs. @swc/helpers) lock-dan çıxarır, npm 10/11 isə onları tələb edir.
      # Ona görə CI package.json-dakı `packageManager` dəyəri ilə eyni npm-i quraşdırır.
      - name: package.json-dakı npm versiyasını qur
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@').pop()")"
          echo "packageManager: npm@${NPM_VERSION}"
          npm install -g "npm@${NPM_VERSION}"
          npm --version

      - name: Asılılıqları quraşdır
        run: npm ci

      - name: Testləri işlə
        run: npm run test

      - name: TypeScript yoxlaması
        run: npm run typecheck

      - name: ESLint yoxlaması
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production D1 miqrasiya vəziyyətini yoxla
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler d1 migrations list DB --remote
