frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "src/app/**/page.tsx"
          - "src/app/**/layout.tsx"
          - "src/app/**/loading.tsx"
          - "src/app/**/error.tsx"
          - "src/app/**/not-found.tsx"
          - "src/components/**"

backend:
  - changed-files:
      - any-glob-to-any-file:
          - "src/lib/**"
          - "src/app/**/actions.ts"
          - "src/app/**/route.ts"
          - "src/middleware.ts"
          - "workers/**"

api:
  - changed-files:
      - any-glob-to-any-file:
          - "src/app/api/**"
          - "src/app/media/**"
          - "workers/**"

admin:
  - changed-files:
      - any-glob-to-any-file:
          - "src/app/admin/**"
          - "src/components/admin/**"
          - "src/lib/admin/**"

database:
  - changed-files:
      - any-glob-to-any-file:
          - "prisma/**"
          - "migrations/**"
          - "wrangler.jsonc"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"
          - "Wiki/**"

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/dependabot.yml"
          - ".github/labeler.yml"
          - ".github/CODEOWNERS"

testing:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**/__tests__/**"
          - "e2e/**"
