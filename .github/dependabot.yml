version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Baku
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    # Bu major yeniləmələr upstream uyğunluğu gələnə qədər saxlanılır:
    # - typescript 7: typescript-eslint yalnız TS <6.1 dəstəkləyir, lint çökür.
    # - eslint 10: eslint-config-next-in eslint-plugin-react-ı ESLint 10-da
    #   `context.getFilename` olmadığı üçün çökür.
    # - vitest 5: @cloudflare/vitest-plugin peer olaraq yalnız vitest ^4 qəbul edir.
    # Yalnız sınan versiyalar bağlanır (məs. TS 6.0 hələ təklif oluna bilər).
    # Plugin/konfiq yeni major-u dəstəkləyəndə uyğun sətri sil.
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7"
      - dependency-name: eslint
        versions:
          - ">=10"
      - dependency-name: vitest
        versions:
          - ">=5"
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Baku
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
